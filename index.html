    font-family: 'IBM Plex Sans', sans-serif;

  .hero {

    font-size: 0.95rem;

  }

  p.status {
    font-size: 1rem;
    color: var(--teal-050);

  footer {
    background-color: var(--brick-1);
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    row-gap: 8px;
  }

  a.link {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--brick-3);
    text-decoration: none;
    border-bottom: 1px solid rgba(216,90,48,0.4);
    padding-bottom: 2px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  a.link:hover, a.link:focus-visible {
    border-color: var(--brick-3);
    color: #f2a37f;
  }

  a.link:focus-visible {
    outline: 2px solid var(--teal-200);
    outline-offset: 4px;
  }

  .did {

  }

  @media (max-width: 480px) {
    .hero { min-height: 70vh; padding: 20px; }
    .below { padding: 32px 20px; }
