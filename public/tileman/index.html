<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f14">
<title>Tileman</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #170f14;
    --panel: #241820;
    --line: #3a2a33;
    --text: #f6ecd4;
    --muted: #b9ab93;
    --accent: #ffb703;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px;
  }
  main { max-width: 440px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .net { margin-left: auto; font-size: 12px; color: var(--muted); }
  .net.off { color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px;
  }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 10px;
    padding: 11px 16px; cursor: pointer; background: var(--accent); color: #241400;
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, li:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .progress { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 1.4em; }
  .error { color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
  }
  ul.list li + li { margin-top: 6px; }
  ul.list li:hover { background: rgba(255,255,255,.03); }
  ul.list li.current { border-color: var(--accent); }
  .thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--bg); flex: none; }
  .li-text { flex: 1; min-width: 0; }
  .li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-sub { font-size: 13px; color: var(--muted); }
  .num { width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; text-align: right; }

  .tape { display: flex; gap: 14px; align-items: center; }
  .tape img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--bg); flex: none; }
  .tape .tapeTitle { font-size: 13px; color: var(--muted); }
  .tape .title { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .tape .artist { font-size: 14px; color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .round {
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; flex: none;
    background: transparent; border: 1px solid var(--line);
  }
  .round svg { width: 20px; height: 20px; fill: var(--text); }
  .play { width: 64px; height: 64px; background: var(--accent); border: none; }
  .play svg { width: 26px; height: 26px; fill: #241400; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seekwrap { margin-top: 10px; }

  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); margin-top: 8px; max-height: 300px; overflow: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <h1>Tileman</h1>
    <span class="net" id="net"></span>
  </header>

  <!-- shelf: the tapes saved on this phone -->
  <section id="shelf">
    <h2>Your tapes</h2>
    <ul class="list" id="tapes"></ul>
    <p class="empty hidden" id="noTapes">No tapes on this phone yet.</p>
    <div class="row">
      <button id="showAdd">Add a tape</button>
    </div>
  </section>

  <section id="add" class="hidden">
    <h2>Add a tape</h2>
    <label for="addr">Tile address</label>
    <input type="text" id="addr" autocomplete="off" spellcheck="false" placeholder="at://did:plc:…/ing.dasl.masl/…">
    <label for="artistIn">Artist line (optional)</label>
    <input type="text" id="artistIn" autocomplete="off" placeholder="Leave blank to use the tape's own">
    <div class="row">
      <button id="addBtn">Save to this phone</button>
      <button class="secondary" id="cancelAdd">Cancel</button>
    </div>
    <div class="progress" id="addMsg"></div>
  </section>

  <!-- player -->
  <section id="player" class="hidden">
    <div class="tape">
      <img id="art" alt="">
      <div>
        <div class="tapeTitle" id="tapeTitle"></div>
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
      </div>
    </div>
    <div class="seekwrap">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in track">
      <div class="times"><span id="now">0:00</span><span id="trackNum"></span><span id="total">0:00</span></div>
    </div>
    <div class="controls">
      <button class="round" id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="round play" id="play" aria-label="Play">
        <svg viewBox="0 0 24 24"><path id="icon" d="M7 4l13 8-13 8z"/></svg>
      </button>
      <button class="round" id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <ul class="list" id="tracks" style="margin-top:14px"></ul>
    <div class="row">
      <button class="secondary" id="backBtn">Back to tapes</button>
      <button class="secondary" id="removeBtn">Remove from phone</button>
    </div>
  </section>

  <section>
    <details id="logBox">
      <summary>Test log</summary>
      <div id="log"></div>
      <div class="row"><button class="secondary" id="clearLog">Clear log</button></div>
    </details>
  </section>

  <audio id="audio" preload="auto"></audio>
</main>
<script src="app.js"></script>
</body>
</html>
