<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f14">
<title>Tileman</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #170f14;
    --panel: #241820;
    --line: #3a2a33;
    --text: #f6ecd4;
    --muted: #b9ab93;
    --accent: #ffb703;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px;
  }
  main { max-width: 440px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .net { margin-left: auto; font-size: 12px; color: var(--muted); }
  .net.off { color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px;
  }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 10px;
    padding: 11px 16px; cursor: pointer; background: var(--accent); color: #241400;
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .progress { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 1.4em; }
  .error { color: var(--danger); }

  .tape { display: flex; gap: 14px; align-items: center; }
  .tape img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--bg); flex: none; }
  .tape .title { font-size: 20px; font-weight: 700; }
  .tape .artist { font-size: 14px; color: var(--muted); }
  .play {
    width: 64px; height: 64px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; flex: none;
  }
  .play svg { width: 26px; height: 26px; fill: #241400; }
  input[type=range] { padding: 0; border: none; background: none; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seekwrap { flex: 1; min-width: 0; }

  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #log { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); margin-top: 8px; max-height: 260px; overflow: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <h1>Tileman</h1>
    <span class="net" id="net"></span>
  </header>

  <section id="add">
    <h2>Add a tape</h2>
    <label for="addr">Tile address</label>
    <input id="addr" autocomplete="off" spellcheck="false"
           value="at://did:plc:joer5rzmwgec3dkr4srfmq45/ing.dasl.masl/3mwztqi2rl2i4">
    <label for="artistIn">Artist line (optional)</label>
    <input id="artistIn" autocomplete="off" value="Grateful Dead · Alpine Valley 7/19/89">
    <div class="row">
      <button id="addBtn">Save to this phone</button>
    </div>
    <div class="progress" id="addMsg"></div>
  </section>

  <section id="player" class="hidden">
    <div class="tape">
      <img id="art" alt="">
      <div>
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
      </div>
    </div>
    <div class="row">
      <button class="play" id="play" aria-label="Play">
        <svg viewBox="0 0 24 24"><path id="icon" d="M7 4l13 8-13 8z"/></svg>
      </button>
      <div class="seekwrap">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
        <div class="times"><span id="now">0:00</span><span id="total">0:00</span></div>
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="removeBtn">Remove from phone</button>
    </div>
  </section>

  <section>
    <details id="logBox">
      <summary>Test log</summary>
      <div id="log"></div>
      <div class="row"><button class="secondary" id="clearLog">Clear log</button></div>
    </details>
  </section>

  <audio id="audio" preload="auto"></audio>
</main>
<script src="app.js"></script>
</body>
</html>
